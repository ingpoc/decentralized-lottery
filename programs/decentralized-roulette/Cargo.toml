[package]
name = "decentralized-roulette"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "decentralized_roulette"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
no-log-data = []
anchor-debug = []
custom-heap = []
custom-panic = []
no-idl = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
anchor-derive-space = "0.30.1"
spl-token = { workspace = true }
spl-associated-token-account = { workspace = true }
thiserror = "1.0"
num-derive = "0.4.2"
solana-program = { workspace = true }
# switchboard-on-demand = { workspace = true }  # Temporarily disabled due to proc-macro2 compilation issues
# tuktuk-sdk = { git = "https://github.com/helium/tuktuk.git", branch = "main" }  # TukTuk SDK - disabled due to version conflict

[profile.release]
overflow-checks = true

[package.metadata.anchor]
program = { name = "decentralized_roulette", id = "4ZVg5wU59Tr6pKAfxkTFsF2cffGrVRM2xqt1WbPUJrUB" }
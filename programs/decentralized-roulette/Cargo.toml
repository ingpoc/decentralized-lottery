[package]
name = "decentralized-roulette"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "decentralized_roulette"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
no-log-data = []
anchor-debug = []
custom-heap = []
custom-panic = []
no-idl = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
anchor-derive-space = "0.30.1"
spl-token = { version = "4.0.3", features = ["no-entrypoint"] }
thiserror = "1.0"
num-derive = "0.4.2"
solana-program = "1.18.17"
# Temporarily comment out switchboard until we resolve import issues
# switchboard-solana = "0.30.4"

[profile.release]
overflow-checks = true

[package.metadata.anchor]
program = { name = "decentralized_roulette", id = "4ZVg5wU59Tr6pKAfxkTFsF2cffGrVRM2xqt1WbPUJrUB" }
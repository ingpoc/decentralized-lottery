[package]
name = "decentralized-lottery"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "decentralized_lottery"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
no-log-data = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
anchor-derive-space = "0.31.1"
thiserror = "1.0"
num-derive = "0.4.2"
# switchboard-solana = { workspace = true }  # Temporarily disabled - VRF instructions are commented out
bytemuck = "1.13.1"  # Required for Switchboard VRF result parsing
bincode = { workspace = true }

[package.metadata.anchor]
program = { name = "decentralized_lottery", id = "BH1qtDhU6PtB1jrUJPf8JoNt34ELuTvVTDktDLFyq2JV" }

[build-dependencies]
# Ensure proc-macro2 has span locations enabled for anchor-syn IDL generation
proc-macro2 = { version = "1.0", features = ["span-locations"] }
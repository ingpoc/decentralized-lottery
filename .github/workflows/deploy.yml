name: Deploy to Devnet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v1.1.0, etc.)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.75.0
        components: rustfmt, clippy
        override: true
        
    - name: Install Solana
      uses: hanako/solana-action@v1
      with:
        solana_version: "1.17.5"
        
    - name: Install Anchor
      run: |
        cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
        avm install 0.30.1
        avm use 0.30.1
        
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build
      run: |
        cargo build-sbf --release
        
    - name: Deploy to Devnet
      env:
        SOLANA_NETWORK: devnet
        SOLANA_URL: https://api.devnet.solana.com
        WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
      run: |
        solana config set --url $SOLANA_URL
        solana airdrop 2
        
        # Deploy program
        PROGRAM_ID=$(solana program deploy --program-id target/deploy/decentralized_roulette-keypair.json \
          target/deploy/decentralized_roulette.so | grep "Program Id" | awk '{print $3}')
        
        # Update program ID in Anchor.toml
        sed -i "s/^decentralized_roulette = .*/decentralized_roulette = \"$PROGRAM_ID\"/" Anchor.toml
        
        echo "Deployed program ID: $PROGRAM_ID"
        echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
        
    - name: Run Integration Tests
      run: |
        anchor test --skip-local-validator
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/deploy/decentralized_roulette.so
          target/deploy/decentralized_roulette-keypair.json
        generate_release_notes: true

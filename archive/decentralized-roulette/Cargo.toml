[package]
name = "decentralized-roulette"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "decentralized_roulette"

[features]
default = []
development = []  # Feature flag for development/testing only code
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
no-log-data = []
anchor-debug = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
anchor-derive-space = "0.31.1"
thiserror = "1.0"
num-derive = "0.4.2"
# switchboard-solana = { workspace = true }  # Temporarily disabled - VRF instructions are commented out
# bytemuck = "1.13.1"  # Required for Switchboard VRF result parsing - disabled with switchboard
bincode = { workspace = true }
# Ensure span locations are enabled globally for IDL generation (anchor-syn -> proc-macro2::Span::source_file)
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[package.metadata.anchor]
program = { name = "decentralized_roulette", id = "saLmMwuHKHDvaaPsA6GRaEjjzvmhx1VRgJGYeJpNDbr" }
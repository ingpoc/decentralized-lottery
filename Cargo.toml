[workspace]
members = [
    "programs/decentralized-roulette",
    "programs/decentralized-lottery"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

# Workspace-level dependency resolution - Anchor 0.31.1 + Solana 2.0.x ecosystem
[workspace.dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "associated_token", "token_2022"] }
# Align ALL Solana dependencies to 2.0.0 for Anchor 0.31.1 compatibility
solana-program = "2.0.0"
solana-curve25519 = "2.0.0"
solana-sdk = "2.0.0"
zeroize = "1.3.0"
# Ensure span locations are available for anchor-syn IDL build
proc-macro2 = { version = "1.0", features = ["span-locations"] }
# Switchboard VRF temporarily disabled for build isolation - VRF instructions are commented out
# switchboard-solana = "0.30.0"
bincode = "1.3.3"

[dependency-overrides]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
zeroize = "1.3.0"

[workspace]
members = [
    "programs/decentralized-lottery",
    "programs/decentralized-roulette"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

# Workspace-level dependency resolution
[workspace.dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "1.18.17"
spl-token = { version = "4.0.3", features = ["no-entrypoint"] }
spl-associated-token-account = "2.3.0"
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
# switchboard-on-demand = "0.4.2"  # Temporarily disabled due to proc-macro2 compilation issues

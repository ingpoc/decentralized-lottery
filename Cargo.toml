[workspace]
members = [
    "programs/decentralized-lottery"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

# Workspace-level dependency resolution - Anchor 0.31.1 + Solana 2.1.x ecosystem
[workspace.dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# Only the base "token" feature; excluded token_2022 and associated_token because they
# transitively pull spl-token-2022 -> solana-zk-sdk -> zeroize_derive 1.5 / block-buffer 0.12,
# whose edition2024 manifests the bundled platform-tools cargo (1.79/1.84) cannot parse.
# The program does manual SPL Transfer CPI and associated-token creation off-chain.
anchor-spl = { version = "0.31.1", default-features = false, features = ["token"] }
# Pin Solana crates to 2.1.0 to match anchor-spl's transitive solana-zk-sdk =2.1.0 requirement
solana-program = "=2.1.0"
solana-curve25519 = "=2.1.0"
solana-sdk = "=2.1.0"
zeroize = "1.3.0"
# Ensure span locations are available for anchor-syn IDL build
proc-macro2 = { version = "1.0", features = ["span-locations"] }
# Switchboard VRF temporarily disabled for build isolation - VRF instructions are commented out
# switchboard-solana = "0.30.0"
bincode = "1.3.3"

[package]
name = "decentralized-lottery-workspace"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "programs/decentralized-lottery"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

# Remove workspace-level anchor-lang dependency to avoid conflicts
[dependencies]
anchor-lang = "0.30.1"

[features]
idl-build = ["anchor-lang/idl-build"]
